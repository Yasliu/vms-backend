# Tests always run on in-memory H2, never on the real database, regardless of .env or OS variables.
spring.config.import=
spring.datasource.url=jdbc:h2:mem:vms-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Fixture only: a throwaway signing key that exists nowhere outside the test suite.
app.security.jwt.secret=test-only-signing-key-0123456789-abcdefghijklmnop
app.security.jwt.ttl=30m
app.security.bootstrap-admin.email=
app.security.bootstrap-admin.password=
app.security.registration-code=test-only-registration-code-12345
