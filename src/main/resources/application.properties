spring.application.name=vms-backend

# Optional, git-ignored local file with KEY=value lines (see .env.example).
# Real OS environment variables always take precedence over it.
spring.config.import=optional:file:.env[.properties]

# --- Database (PostgreSQL) ---------------------------------------------------
# DB_NAME, DB_USERNAME and DB_PASSWORD are required: startup fails fast if missing.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}

# --- JPA ---------------------------------------------------------------------
# "update" is a development convenience. Use "validate" or "none" once Flyway
# migrations are in place, and always outside local development.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Web / errors ------------------------------------------------------------
server.port=${PORT:8080}
server.error.include-message=never
spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.max-page-size=100

# --- Authentication (JWT bearer tokens) --------------------------------------
# JWT_SECRET is required: at least 32 characters, e.g. `openssl rand -base64 48`.
# Startup fails if it is missing or too short (see JwtConfigurationValidator).
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.ttl=${JWT_TTL:30m}
# The first admin account is created from these only while the users table is empty.
app.security.bootstrap-admin.email=${ADMIN_EMAIL:}
app.security.bootstrap-admin.password=${ADMIN_PASSWORD:}

# Self-service sign-up is switched on only when REGISTRATION_CODE is set (at least 12 characters).
# Callers must send the same code in the sign-up request. Leave it unset to turn sign-up off.
app.security.registration-code=${REGISTRATION_CODE:}

# --- CORS --------------------------------------------------------------------
# Comma-separated origin patterns allowed to call /api/** from a browser.
# The default only allows local development servers; set CORS_ALLOWED_ORIGINS
# to the real frontend origin (e.g. https://vms.example.com) in other environments.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# --- Actuator ----------------------------------------------------------------
# /actuator/health reports overall status and whether the "db" component is UP, never connection details.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
